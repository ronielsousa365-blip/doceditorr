<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#00f0ff">
<title>DocEditor Cyber</title>
<link rel="manifest" href="manifest.json">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
--bg:#08111f;
--bg2:#111c2f;
--card:#15233a;
--accent:#00f0ff;
--accent2:#7c4dff;
--text:#e8f7ff;
--text2:#8fb7c9;
--border:#20324d;
}
body{
background:linear-gradient(180deg,#08111f,#111827);
color:var(--text);
font-family:Segoe UI,sans-serif;
height:100vh;
display:flex;
flex-direction:column;
overflow:hidden;
}
header{
background:rgba(0,0,0,.25);
backdrop-filter:blur(10px);
border-bottom:1px solid var(--border);
padding:14px;
display:flex;
align-items:center;
justify-content:space-between;
}
header h1{font-size:18px;color:var(--accent);}
.header-actions{display:flex;gap:8px;}
.btn{
background:var(--card);
color:var(--text);
padding:10px 14px;
border-radius:10px;
border:1px solid var(--border);
cursor:pointer;
}
.toolbar{
display:flex;
gap:8px;
padding:10px;
background:#0c1627;
overflow-x:auto;
}
.toolbar button{
background:var(--card);
color:var(--text);
padding:8px 12px;
border:none;
border-radius:8px;
cursor:pointer;
}
.upload-box{
padding:12px;
background:#0c1627;
display:flex;
gap:10px;
}
#editor{
flex:1;
padding:20px;
outline:none;
overflow-y:auto;
font-size:17px;
line-height:1.7;
}
.bottom{
background:#0c1627;
padding:10px;
display:flex;
justify-content:space-between;
font-size:13px;
color:var(--text2);
}
.export-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
padding:15px;
background:#0c1627;
}
.card{
background:var(--card);
padding:15px;
border-radius:12px;
text-align:center;
cursor:pointer;
}
</style>
</head>
<body>

<header>
<h1>⚡ DocEditor Cyber</h1>

<div class="header-actions">
<button class="btn" onclick="copyText()">📋 Copiar</button>
<button class="btn" onclick="clearEditor()">🗑 Limpar</button>
</div>
</header>

<div class="toolbar">
<button onclick="cmd('bold')"><b>N</b></button>
<button onclick="cmd('italic')"><i>I</i></button>
<button onclick="cmd('underline')"><u>S</u></button>
<button onclick="cmd('insertUnorderedList')">• Lista</button>
</div>

<div class="upload-box">
<input type="file" id="fileInput" accept=".txt,.pdf">
<button class="btn" onclick="loadFile()">📂 Abrir Arquivo</button>
</div>

<div id="editor" contenteditable="true"></div>

<div class="export-grid">
<div class="card" onclick="exportFile('txt')">📄 TXT</div>
<div class="card" onclick="exportFile('html')">🌐 HTML</div>
<div class="card" onclick="window.print()">🖨 PDF</div>
</div>

<div class="bottom">
<span id="words">0 palavras</span>
<span>Salvamento automático</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
const editor = document.getElementById('editor');

if('serviceWorker' in navigator){
navigator.serviceWorker.register('sw.js');
}

function cmd(c){
document.execCommand(c,false,null);
editor.focus();
}

function updateStats(){
const text = editor.innerText.trim();
const words = text ? text.split(/\s+/).length : 0;
document.getElementById('words').textContent = words + ' palavras';
}

function saveContent(){
localStorage.setItem('doceditor-content',editor.innerHTML);
}

function loadContent(){
const saved = localStorage.getItem('doceditor-content');
if(saved){
editor.innerHTML = saved;
updateStats();
}
}

editor.addEventListener('input',()=>{
updateStats();
saveContent();
});

function clearEditor(){
editor.innerHTML='';
saveContent();
updateStats();
}

function copyText(){
navigator.clipboard.writeText(editor.innerText);
}

function exportFile(type){
let content='';
let mime='text/plain';

if(type==='txt'){
content = editor.innerText;
}

if(type==='html'){
content = editor.innerHTML;
mime='text/html';
}

const blob = new Blob([content],{type:mime});
const a = document.createElement('a');
a.href = URL.createObjectURL(blob);
a.download = 'documento.' + type;
a.click();
}

async function loadFile(){

const file = document.getElementById('fileInput').files[0];

if(!file)return;

if(file.type === 'application/pdf'){

const reader = new FileReader();

reader.onload = async function(){

const typedarray = new Uint8Array(this.result);

const pdf = await pdfjsLib.getDocument(typedarray).promise;

let fullText = '';

for(let i=1;i<=pdf.numPages;i++){

const page = await pdf.getPage(i);

const textContent = await page.getTextContent();

const textItems = textContent.items.map(item=>item.str);

fullText += textItems.join(' ') + '\\n\\n';

}

editor.innerText = fullText;
updateStats();
saveContent();

}

reader.readAsArrayBuffer(file);

return;
}

const reader = new FileReader();

reader.onload = function(e){
editor.innerText = e.target.result;
updateStats();
saveContent();
}

reader.readAsText(file);
}

loadContent();
updateStats();
</script>

</body>
</html>
